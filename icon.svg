<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="#0D0D0D"/>

  <!-- Outer radar ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#4F83FF" stroke-width="10" opacity="0.25"/>
  <!-- Mid radar ring -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#4F83FF" stroke-width="10" opacity="0.45"/>
  <!-- Inner radar ring -->
  <circle cx="256" cy="256" r="72" fill="none" stroke="#4F83FF" stroke-width="10" opacity="0.7"/>

  <!-- Radar sweep (filled arc) -->
  <path d="M256,256 L256,66 A190,190 0 0,1 431,356 Z" fill="url(#sweep)" opacity="0.35"/>

  <!-- Crosshair lines -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="#4F83FF" stroke-width="2" opacity="0.18"/>
  <line x1="56" y1="256" x2="456" y2="256" stroke="#4F83FF" stroke-width="2" opacity="0.18"/>

  <!-- Radar sweep line -->
  <line x1="256" y1="256" x2="256" y2="66" stroke="#4F83FF" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <line x1="256" y1="256" x2="431" y2="356" stroke="#4F83FF" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

  <!-- Blip 1 — strong hit upper right -->
  <circle cx="320" cy="148" r="14" fill="#4F83FF" opacity="1"/>
  <circle cx="320" cy="148" r="24" fill="none" stroke="#4F83FF" stroke-width="3" opacity="0.5"/>

  <!-- Blip 2 — medium hit right -->
  <circle cx="370" cy="290" r="9" fill="#6B99FF" opacity="0.8"/>

  <!-- Blip 3 — faint hit -->
  <circle cx="188" cy="178" r="7" fill="#4F83FF" opacity="0.5"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="10" fill="#4F83FF"/>
  <circle cx="256" cy="256" r="5" fill="#fff"/>

  <defs>
    <radialGradient id="sweep" cx="256" cy="256" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F83FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4F83FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
