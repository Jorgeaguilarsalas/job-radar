<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Job Radar · Jorge Aguilar</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4F83FF">
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS home screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Job Radar">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* ── DESIGN TOKENS ─────────────────────────────────────────────────────── */
:root {
  --bg:          #0A0A0F;
  --surface:     #12121A;
  --surface2:    #1A1A24;
  --surface3:    #22222E;
  --on-s:        #EEEDF5;
  --muted:       #8A8AA0;
  --subtle:      #5A5A72;
  --border:      #26263A;
  --border-soft: #1E1E2A;

  --accent:      #5B7FFF;
  --accent-lt:   #7A9AFF;
  --accent-dk:   #4366E8;
  --accent-bg:   rgba(91,127,255,.12);
  --accent-glow: rgba(91,127,255,.25);

  --green:       #2DD4A0;
  --green-bg:    rgba(45,212,160,.11);
  --green-glow:  rgba(45,212,160,.2);
  --orange:      #FF8C42;
  --orange-bg:   rgba(255,140,66,.11);
  --red:         #FF6B6B;
  --red-bg:      rgba(255,107,107,.11);
  --purple:      #B27DFF;
  --purple-bg:   rgba(178,125,255,.11);
  --sky:         #38CAFF;
  --sky-bg:      rgba(56,202,255,.11);
  --amber:       #FFB830;
  --amber-bg:    rgba(255,184,48,.11);
  --gray:        #8899AA;
  --gray-bg:     rgba(136,153,170,.09);

  --header-bg:   #07070E;
  --header-text: #EEEDF5;

  --r4:  4px;
  --r6:  6px;
  --r8:  8px;
  --r10: 10px;
  --r12: 12px;
  --r16: 16px;
  --r20: 20px;
  --r24: 24px;
  --shadow-xs: 0 1px 3px rgba(0,0,0,.4);
  --shadow-sm: 0 2px 8px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 8px 24px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.4);
  --shadow-lg: 0 20px 60px rgba(0,0,0,.7), 0 8px 24px rgba(0,0,0,.5);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--on-s);
  min-height: 100dvh;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ── SIGN-IN ───────────────────────────────────────────────────────────── */
#signin-screen {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 100dvh; gap: 24px;
  padding: 24px; text-align: center;
  background: radial-gradient(ellipse at 50% 0%, rgba(91,127,255,.08) 0%, var(--bg) 70%);
  color: var(--on-s);
}
.signin-logo {
  width: 64px; height: 64px;
  background: linear-gradient(135deg, var(--accent) 0%, #8B5CF6 100%);
  border-radius: var(--r16); display: flex; align-items: center;
  justify-content: center; font-size: 1.8rem; line-height: 1;
  box-shadow: 0 8px 32px rgba(91,127,255,.35);
}
.signin-title { font-size: 1.6rem; font-weight: 800; letter-spacing: -.5px; color: var(--on-s); }
.signin-sub { font-size: .875rem; color: var(--muted); max-width: 280px; line-height: 1.6; }
.signin-btn {
  background: var(--accent);
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dk) 100%);
  color: #fff; border: none; padding: 14px 32px; border-radius: var(--r12);
  font-size: .938rem; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 4px 16px rgba(91,127,255,.35);
  transition: transform .15s, box-shadow .15s;
  font-family: inherit;
}
.signin-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(91,127,255,.45); }
.signin-btn:active { transform: translateY(0); }
.signin-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
#signin-error { color: var(--red); font-size: .8rem; display: none; max-width: 300px; }

/* ── APP SHELL ─────────────────────────────────────────────────────────── */
#app { display: none; flex-direction: column; min-height: 100dvh; }

/* ── HEADER ────────────────────────────────────────────────────────────── */
header {
  background: var(--header-bg);
  border-bottom: 1px solid rgba(255,255,255,.06);
  color: var(--header-text);
  padding-top: env(safe-area-inset-top);
  height: calc(52px + env(safe-area-inset-top));
  display: flex; align-items: flex-end; justify-content: space-between;
  padding-bottom: 10px;
  padding-left: calc(16px + env(safe-area-inset-left));
  padding-right: calc(12px + env(safe-area-inset-right));
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.header-brand { display: flex; align-items: center; gap: 10px; }
.header-brand-mark {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, var(--accent) 0%, #8B5CF6 100%);
  border-radius: var(--r8); display: flex; align-items: center;
  justify-content: center; font-size: .68rem; font-weight: 800;
  letter-spacing: -.5px; color: #fff; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(91,127,255,.3);
}
.header-title { font-size: .95rem; font-weight: 700; letter-spacing: -.2px; }

/* user avatar button */
.user-avatar-btn {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent) 0%, #8B5CF6 100%);
  border: none; cursor: pointer; display: flex; align-items: center;
  justify-content: center; font-size: .72rem; font-weight: 800; color: #fff;
  letter-spacing: -.3px; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(91,127,255,.25);
  transition: transform .15s, box-shadow .15s;
  font-family: inherit;
}
.user-avatar-btn:hover { transform: scale(1.06); box-shadow: 0 3px 12px rgba(91,127,255,.4); }

/* ── BOTTOM NAV ────────────────────────────────────────────────────────── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: var(--header-bg);
  border-top: 1px solid rgba(255,255,255,.07);
  display: flex; align-items: stretch;
  padding-bottom: env(safe-area-inset-bottom);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  height: calc(60px + env(safe-area-inset-bottom));
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 4px;
  border: none; background: none; cursor: pointer; color: rgba(255,255,255,.38);
  font-size: .65rem; font-weight: 600; letter-spacing: .2px;
  padding: 8px 4px 4px; transition: color .2s;
  font-family: inherit; -webkit-tap-highlight-color: transparent;
}
.nav-item svg { width: 22px; height: 22px; transition: transform .2s cubic-bezier(.34,1.56,.64,1); }
.nav-item.active { color: var(--accent-lt); }
.nav-item.active svg { transform: scale(1.12); }
.nav-item:not(.active):hover { color: rgba(255,255,255,.65); }
/* active pill behind icon */
.nav-icon-wrap {
  position: relative; display: flex; align-items: center; justify-content: center;
  width: 44px; height: 26px;
}
.nav-icon-wrap::before {
  content: ''; position: absolute; inset: 0;
  border-radius: 13px; background: var(--accent-bg);
  opacity: 0; transition: opacity .2s;
}
.nav-item.active .nav-icon-wrap::before { opacity: 1; }

/* ── TAB CONTENT ───────────────────────────────────────────────────────── */
.tab-content {
  display: none; padding: 14px 16px;
  padding-bottom: calc(74px + env(safe-area-inset-bottom));
  max-width: 680px; margin: 0 auto; width: 100%;
}
.tab-content.active { display: block; }

/* ── PROFILE SHEET ─────────────────────────────────────────────────────── */
.profile-sheet-bg {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.5); backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.profile-sheet-bg.open { display: block; }
.profile-sheet {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 201;
  background: var(--surface); border-radius: var(--r16) var(--r16) 0 0;
  border: 1px solid var(--border); border-bottom: none;
  padding-bottom: env(safe-area-inset-bottom);
  box-shadow: var(--shadow-lg);
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.32,1,.32,1);
}
.profile-sheet-bg.open .profile-sheet { transform: translateY(0); }
.profile-sheet-handle {
  width: 36px; height: 4px; background: var(--border);
  border-radius: 2px; margin: 10px auto 0;
}
.profile-sheet-user {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 20px 14px;
  border-bottom: 1px solid var(--border);
}
.profile-avatar-lg {
  width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent) 0%, #8B5CF6 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: .88rem; font-weight: 800; color: #fff; flex-shrink: 0;
}
.profile-name { font-size: .938rem; font-weight: 700; color: var(--on-s); letter-spacing: -.1px; }
.profile-email { font-size: .78rem; color: var(--muted); margin-top: 1px; }
.profile-menu { padding: 8px 0; }
.profile-menu-item {
  display: flex; align-items: center; gap: 14px; width: 100%;
  padding: 12px 20px; border: none; background: none; cursor: pointer;
  font-size: .88rem; color: var(--on-s); text-align: left;
  transition: background .15s; font-family: inherit;
}
.profile-menu-item:hover { background: var(--surface2); }
.profile-menu-item svg { width: 18px; height: 18px; color: var(--muted); flex-shrink: 0; }
.profile-menu-item.danger { color: var(--red); }
.profile-menu-item.danger svg { color: var(--red); }
.profile-menu-sep { height: 1px; background: var(--border); margin: 4px 0; }

/* ── STATS ─────────────────────────────────────────────────────────────── */
.stats-row {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 8px; margin-bottom: 12px;
}
@media (max-width: 400px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }

.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r10); padding: 12px 13px;
  cursor: pointer; transition: border-color .2s, box-shadow .2s, transform .15s, background .2s;
  user-select: none; position: relative; overflow: hidden;
}
.stat-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  opacity: 0; transition: opacity .2s;
}
.stat-card.s-active::before   { background: var(--accent); }
.stat-card.s-sent::before     { background: var(--green); }
.stat-card.s-review::before   { background: var(--orange); }
.stat-card.s-closed::before   { background: var(--red); }
.stat-card.s-amber::before    { background: var(--amber); }
.stat-card:hover { border-color: var(--border-soft); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.stat-card:hover::before { opacity: 1; }
.stat-card.active-filter { border-color: var(--accent); background: var(--accent-bg); box-shadow: 0 0 0 1px rgba(91,127,255,.25), var(--shadow-sm); }
.stat-card.active-filter::before { opacity: 1; }
.stat-card.active-filter .stat-lbl { color: var(--accent-lt); }
.stat-n { font-size: 1.65rem; font-weight: 800; line-height: 1.1; letter-spacing: -.6px; color: var(--on-s); }
.stat-lbl { font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .7px; color: var(--subtle); margin-top: 3px; }
.stat-sub { font-size: .68rem; color: var(--subtle); margin-top: 1px; }

.stat-card.s-active   .stat-n { color: var(--accent-lt); }
.stat-card.s-sent     .stat-n { color: var(--green); }
.stat-card.s-review   .stat-n { color: var(--orange); }
.stat-card.s-closed   .stat-n { color: var(--red); }
.stat-card.s-rejected .stat-n { color: var(--red); }
.stat-card.s-amber    .stat-n { color: var(--amber); }

/* ── HOME ──────────────────────────────────────────────────────────────── */
.home-hello { font-size: 1.35rem; font-weight: 800; letter-spacing: -.5px; margin: 2px 0 2px; }
.home-sub { font-size: .82rem; color: var(--muted); margin-bottom: 16px; }
.home-section {
  font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .8px;
  color: var(--subtle); margin: 18px 0 8px; display: flex; justify-content: space-between; align-items: baseline;
}
.home-section:first-of-type { margin-top: 0; }
.home-section .home-section-hint { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: .72rem; }
.status-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media (min-width: 560px) { .status-grid { grid-template-columns: repeat(4, 1fr); } }
.status-tile {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r12);
  padding: 13px 14px 12px; cursor: pointer; position: relative; overflow: hidden;
  text-align: left; font-family: inherit; color: var(--on-s);
  transition: border-color .2s, transform .15s, box-shadow .2s;
  -webkit-tap-highlight-color: transparent;
}
.status-tile::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--tile-c); }
.status-tile:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); border-color: var(--tile-c); }
.status-tile:active { transform: scale(.98); }
.status-tile.is-empty { opacity: .45; }
.tile-n { font-size: 1.75rem; font-weight: 800; letter-spacing: -.7px; line-height: 1.05; color: var(--tile-c); }
.tile-lbl { font-size: .78rem; font-weight: 600; margin-top: 4px; }
.tile-sub { font-size: .68rem; color: var(--subtle); margin-top: 1px; }
.tile-arrow { position: absolute; right: 12px; top: 12px; color: var(--subtle); font-size: .8rem; }
.attention-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r12);
  overflow: hidden;
}
.attention-row {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer;
  border-bottom: 1px solid var(--border-soft); transition: background .15s;
}
.attention-row:last-child { border-bottom: none; }
.attention-row:hover { background: var(--surface2); }
.attention-badge {
  min-width: 34px; height: 34px; border-radius: var(--r8); display: flex; align-items: center;
  justify-content: center; font-weight: 800; font-size: .95rem; flex-shrink: 0;
}
.attention-text { flex: 1; min-width: 0; }
.attention-title { font-size: .86rem; font-weight: 600; }
.attention-desc { font-size: .74rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.attention-go { color: var(--subtle); font-size: .9rem; }
.recent-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border-soft); cursor: pointer; }
.recent-row:last-child { border-bottom: none; }
.recent-row:hover { background: var(--surface2); }
.recent-main { flex: 1; min-width: 0; }
.recent-firma { font-size: .84rem; font-weight: 600; }
.recent-stelle { font-size: .72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent-date { font-size: .68rem; color: var(--subtle); white-space: nowrap; }

/* ── STATUS CHIP BAR (Jobs tab) ────────────────────────────────────────── */
.status-chips {
  display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; margin-bottom: 4px;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.status-chips::-webkit-scrollbar { display: none; }
.status-chip {
  flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); color: var(--muted); font-size: .78rem; font-weight: 600;
  cursor: pointer; font-family: inherit; transition: all .15s; -webkit-tap-highlight-color: transparent;
}
.status-chip .chip-n {
  font-size: .7rem; font-weight: 700; padding: 1px 7px; border-radius: 999px;
  background: var(--surface3); color: var(--on-s);
}
.status-chip.selected { background: var(--chip-bg); border-color: var(--chip-c); color: var(--chip-c); }
.status-chip.selected .chip-n { background: var(--chip-c); color: var(--bg); }
.status-chip.is-empty { opacity: .5; }
.list-head { display: flex; justify-content: space-between; align-items: baseline; margin: 2px 2px 10px; }
.list-title { font-size: 1.05rem; font-weight: 800; letter-spacing: -.3px; }
.list-meta { font-size: .74rem; color: var(--subtle); }

/* ── METRICS ROW ───────────────────────────────────────────────────────── */
.metrics-row {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px; margin-bottom: 16px;
}
@media (max-width: 400px) { .metrics-row { grid-template-columns: 1fr 1fr; } }
.metric-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r10); padding: 12px 14px;
}
.metric-label { font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .7px; color: var(--subtle); }
.metric-value { font-size: 1.2rem; font-weight: 700; letter-spacing: -.4px; margin-top: 3px; }
.metric-sub { font-size: .68rem; color: var(--subtle); margin-top: 1px; }
.metric-trend-up   { color: var(--green); }
.metric-trend-down { color: var(--red); }
.metric-trend-flat { color: var(--gray); }

/* ── FUNNEL ────────────────────────────────────────────────────────────── */
.funnel-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r10); padding: 14px 16px; margin-bottom: 16px;
}
.funnel-title { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .7px; color: var(--subtle); margin-bottom: 12px; }
.funnel-steps { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.funnel-step { text-align: center; }
.funnel-step-n { font-size: 1.2rem; font-weight: 800; letter-spacing: -.4px; }
.funnel-step-lbl { font-size: .68rem; color: var(--muted); font-weight: 500; margin-top: 1px; }
.funnel-step-rate { font-size: .65rem; color: var(--subtle); margin-top: 1px; }
.funnel-arrow { color: var(--border); font-size: .85rem; flex-shrink: 0; padding: 0 2px; align-self: flex-start; margin-top: 6px; }
.funnel-step.f-total .funnel-step-n { color: var(--on-s); }
.funnel-step.f-sent .funnel-step-n { color: var(--green); }
.funnel-step.f-response .funnel-step-n { color: var(--accent-lt); }
.funnel-step.f-interview .funnel-step-n { color: var(--purple); }
.funnel-step.f-offer .funnel-step-n { color: var(--green); }

/* ── FILTER INDICATOR ──────────────────────────────────────────────────── */
.filter-bar {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 8px 10px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--r10);
  margin-bottom: 12px;
}
.filter-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: var(--r20);
  background: var(--accent-bg); border: 1px solid rgba(91,127,255,.3);
  font-size: .78rem; font-weight: 600; color: var(--accent-lt);
  line-height: 1;
}
.filter-chip-tag {
  background: rgba(178,125,255,.1); border-color: rgba(178,125,255,.3);
  color: var(--purple);
}
.filter-chip-x {
  background: none; border: none; cursor: pointer;
  color: inherit; font-size: .85rem; line-height: 1; padding: 0;
  opacity: .7; transition: opacity .15s; display: flex; align-items: center;
  font-family: inherit;
}
.filter-chip-x:hover { opacity: 1; }
.filter-clear {
  margin-left: auto; background: none; border: none; color: var(--muted);
  cursor: pointer; font-size: .75rem; font-weight: 500; padding: 3px 8px;
  border-radius: var(--r6); transition: color .15s, background .15s;
  font-family: inherit;
}
.filter-clear:hover { color: var(--on-s); background: var(--surface2); }

/* ── GROUP LABELS ──────────────────────────────────────────────────────── */
.group-label {
  font-size: .68rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .8px; color: var(--subtle);
  margin: 20px 0 8px; padding-left: 2px;
  display: flex; align-items: center; justify-content: space-between;
}
.group-label:first-child { margin-top: 0; }
.group-count {
  font-size: .68rem; font-weight: 600;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--muted); padding: 1px 7px; border-radius: 20px;
}

/* ── JOB CARD ──────────────────────────────────────────────────────────── */
.job-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r12); padding: 14px 16px; margin-bottom: 8px;
  cursor: pointer;

// ── AUTH ────────────────────────────────────────────────────────────────────
function initGoogleAuth() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: async (resp) => {
      if (resp.error) { showSigninError(resp.error_description || resp.error); return; }
      accessToken = resp.access_token;
      tokenExpiry = Date.now() + (resp.expires_in - 60) * 1000;
      let email = '';
      try {
        const ui = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: { Authorization: 'Bearer ' + accessToken }
        });
        const ud = await ui.json();
        email = ud.email || '';
      } catch(e) {}
      onSignedIn(email);
    }
  });
}
function requestToken() {
  if (!tokenClient) { showSigninError('Auth not ready. Reload the page.'); return; }
  tokenClient.requestAccessToken({ prompt: 'consent' });
}
async function ensureToken() {
  if (accessToken && Date.now() < tokenExpiry) return;
  return new Promise((resolve, reject) => {
    const origCb = tokenClient.callback;
    tokenClient.callback = (resp) => {
      tokenClient.callback = origCb;
      if (resp.error) { reject(resp); return; }
      accessToken = resp.access_token;
      tokenExpiry = Date.now() + (resp.expires_in - 60) * 1000;
      resolve();
    };
    tokenClient.requestAccessToken({ prompt: '' });
  });
}
function signOut() {
  if (accessToken) google.accounts.oauth2.revoke(accessToken, () => {});
  accessToken = null; tokenExpiry = 0; allJobs = [];
  document.getElementById('app').style.display = 'none';
  document.getElementById('signin-screen').style.display = 'flex';
}
function showSigninError(msg) {
  const el = document.getElementById('signin-error');
  el.textContent = msg; el.style.display = 'block';
}
async function onSignedIn(userEmail) {
  document.getElementById('signin-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  if (userEmail) {
    const emailEl = document.getElementById('profile-email');
    if (emailEl) emailEl.textContent = userEmail;
  }
  await loadJobs();
}

// ── SHEETS API ──────────────────────────────────────────────────────────────
async function sheetsGet(range) {
  await ensureToken();
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}`;
  const r = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
  if (!r.ok) throw new Error(`Sheets GET ${r.status}`);
  return r.json();
}
async function sheetsPut(range, values) {
  await ensureToken();
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}?valueInputOption=USER_ENTERED`;
  const r = await fetch(url, { method:'PUT', headers:{ Authorization:`Bearer ${accessToken}`, 'Content-Type':'application/json' }, body:JSON.stringify({ values }) });
  if (!r.ok) throw new Error(`Sheets PUT ${r.status}`);
  return r.json();
}
async function sheetsAppend(range, values) {
  await ensureToken();
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`;
  const r = await fetch(url, { method:'POST', headers:{ Authorization:`Bearer ${accessToken}`, 'Content-Type':'application/json' }, body:JSON.stringify({ values }) });
  if (!r.ok) throw new Error(`Sheets APPEND ${r.status}`);
  return r.json();
}
async function sheetsClear(range) {
  await ensureToken();
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}:clear`;
  const r = await fetch(url, { method:'POST', headers:{ Authorization:`Bearer ${accessToken}`, 'Content-Type':'application/json' } });
  if (!r.ok) throw new Error(`Sheets CLEAR ${r.status}`);
  return r.json();
}

// ── DATA HELPERS ─────────────────────────────────────────────────────────────
function rowToObj(row, rowIndex) {
  const obj = { _row: rowIndex };
  COLS.forEach((c, i) => { obj[c] = row[i] !== undefined ? String(row[i]) : ''; });
  try { obj.unterlagen = JSON.parse(obj.unterlagen.trim() || '[]'); } catch { obj.unterlagen = []; }
  obj.datumGeschaetzt = obj.datumGeschaetzt === 'TRUE';
  return obj;
}
function objToRow(data) {
  return COLS.map(c => {
    if (c === 'unterlagen') return ' ' + JSON.stringify(Array.isArray(data[c]) ? data[c] : []);
    if (c === 'datumGeschaetzt') return data[c] ? 'TRUE' : 'FALSE';
    return data[c] !== undefined ? String(data[c]) : '';
  });
}
function slug(text) {
  return text.toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/&/g,'-and-').replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-')
    .replace(/-+/g,'-').replace(/^-|-$/g,'');
}
function todayStr() { return new Date().toISOString().slice(0,10); }
function nowISO()   { return new Date().toISOString(); }

// ── LOAD & RENDER ────────────────────────────────────────────────────────────
async function loadJobs() {
  try {
    const data = await sheetsGet(`${SHEET}!A:Q`);
    if (!data.values || data.values.length < 2) { allJobs = []; }
    else {
      const _seen = new Set();
      allJobs = data.values.slice(1)
        .map((row, i) => rowToObj(row, i + 2))
        .filter(j => j.id && j.status !== 'deleted' && j.status !== '')
        .filter(j => _seen.has(j.id) ? false : _seen.add(j.id));
    }
    renderAll();
  } catch(e) {
    showToast('Error loading data: ' + e.message);
  }
}

function renderAll() {
  renderHome();
  renderStats();
  renderFilterIndicator();
  renderJobs();
  renderInsights();
  renderDocuments();
  renderReport();
}

// ── STATS + FILTERING ────────────────────────────────────────────────────────
function computeCounts() {
  const c = {};
  STATUS_ORDER.forEach(s => c[s] = 0);
  allJobs.forEach(j => { c[j.status] = (c[j.status] || 0) + 1; });
  return c;
}
// Statuses present in the sheet that the app doesn't know (e.g. typos) — shown so nothing hides
function unknownStatuses(c) {
  return Object.keys(c).filter(s => !STATUS_ORDER.includes(s) && c[s] > 0);
}
function daysSince(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr.slice(0,10) + 'T00:00:00');
  if (isNaN(d)) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}
function followupJobs() {
  return allJobs.filter(j => j.status === 'verschickt' && (daysSince(j.verschicktAm || j.gefundenAm) ?? 0) >= FOLLOWUP_DAYS);
}
function statusLabel(s) { return STATUS_LABELS[s] || s; }
function accentVar(s) { return STATUS_ACCENT[s] || '--gray'; }

function goToStatus(key) {
  activeFilter = key;
  activeTagFilter = null;
  renderStats();
  renderFilterIndicator();
  renderJobs();
  switchTab('jobs');
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

// Default list when opening Jobs without a choice: first non-empty actionable status
function resolveFilter() {
  if (activeFilter) return activeFilter;
  const c = computeCounts();
  return ['pruefen','bearbeitung','interview','espera','verschickt'].find(s => c[s]) || 'all';
}

// ── JOBS TAB: status chip bar ────────────────────────────────────────────────
function renderStats() {
  const c = computeCounts();
  const sel = resolveFilter();
  const fuN = followupJobs().length;
  const chip = (key, label, n, accent) => `
    <button class="status-chip${sel===key?' selected':''}${n?'':' is-empty'}"
      style="--chip-c:var(${accent});--chip-bg:var(${accent}-bg)" onclick="setFilter('${key}')">
      ${esc(label)} <span class="chip-n">${n}</span>
    </button>`;
  const chips = [
    chip('all', 'All', allJobs.length, '--accent'),
    ...[...STATUS_ORDER, ...unknownStatuses(c)].map(s => chip(s, statusLabel(s), c[s]||0, accentVar(s))),
  ];
  // follow-up chip sits right after "Sent"
  const sentIdx = 1 + STATUS_ORDER.indexOf('verschickt');
  chips.splice(sentIdx + 1, 0, chip('followup', `No reply ${FOLLOWUP_DAYS}d+`, fuN, '--amber'));
  document.getElementById('stats-area').innerHTML = `<div class="status-chips" id="status-chips">${chips.join('')}</div>`;
  // keep the selected chip visible
  const selEl = document.querySelector('#status-chips .status-chip.selected');
  if (selEl) selEl.scrollIntoView({ block:'nearest', inline:'center' });
}

function setFilter(key) {
  activeFilter = key || 'all';
  renderStats();
  renderFilterIndicator();
  renderJobs();
}

function setTagFilter(field, value, label) {
  if (activeTagFilter && activeTagFilter.field === field && activeTagFilter.value === value) {
    activeTagFilter = null;
  } else {
    activeTagFilter = { field, value, label };
  }
  renderFilterIndicator();
  renderJobs();
}

function clearAllFilters() {
  activeTagFilter = null;
  renderFilterIndicator();
  renderJobs();
}

// Only tag filters need a banner now — the status is shown by the chip bar
function renderFilterIndicator() {
  const el = document.getElementById('filter-indicator');
  if (!activeTagFilter) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  el.innerHTML = `<div class="filter-bar"><span class="filter-chip filter-chip-tag">${esc(activeTagFilter.label)} <button class="filter-chip-x" onclick="clearAllFilters()">✕</button></span></div>`;
}

function filteredJobs(key) {
  let jobs;
  if (key === 'all') jobs = [...allJobs];
  else if (key === 'followup') jobs = followupJobs();
  else jobs = allJobs.filter(j => j.status === key);
  if (activeTagFilter) jobs = jobs.filter(j => j[activeTagFilter.field] === activeTagFilter.value);
  if (key === 'followup') return jobs.sort((a,b) => (a.verschicktAm||'').localeCompare(b.verschicktAm||''));
  return jobs.sort((a,b) => (b.verschicktAm||b.gefundenAm||'').localeCompare(a.verschicktAm||a.gefundenAm||''));
}

function renderJobs() {
  const el = document.getElementById('jobs-list');
  if (!allJobs.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>No jobs yet.<br>Tap <strong>＋</strong> to add one.</p></div>`;
    return;
  }
  const key = resolveFilter();
  const jobs = filteredJobs(key);
  const title = key === 'all' ? 'All applications'
    : key === 'followup' ? `Sent, no reply after ${FOLLOWUP_DAYS}+ days`
    : statusLabel(key);
  const meta = key === 'followup' ? 'oldest first' : 'newest first';

  let html = `<div class="list-head"><div class="list-title">${esc(title)}</div><div class="list-meta">${jobs.length} · ${meta}</div></div>`;
  if (key === 'all') {
    // "All" keeps a light grouping by status so it stays readable
    [...STATUS_ORDER, ...unknownStatuses(computeCounts())].forEach(s => {
      const g = jobs.filter(j => j.status === s);
      if (!g.length) return;
      html += `<div class="group-label">${esc(statusLabel(s))}<span class="group-count">${g.length}</span></div>`;
      g.forEach(j => { html += jobCard(j); });
    });
  } else {
    jobs.forEach(j => { html += jobCard(j); });
  }
  el.innerHTML = jobs.length ? html
    : html + `<div class="empty"><div class="empty-icon">✅</div><p>Nothing here right now.</p></div>`;
}

function jobCard(j) {
  const modusDsp = {Remote:'Remote',Hybrid:'Hybrid','Vor Ort':'On-site'}[j.modus] || j.modus;
  const langDsp  = j.sprache === 'Englisch' ? 'EN' : j.sprache === 'Deutsch' ? 'DE' : j.sprache;
  const date     = j.gefundenAm ? formatDate(j.gefundenAm) : '';
  const tagItems = [
    j.ort     ? { label: j.ort,     field:'ort',     value:j.ort     } : null,
    j.modus   ? { label: modusDsp,  field:'modus',   value:j.modus   } : null,
    j.sprache ? { label: langDsp,   field:'sprache', value:j.sprache } : null,
    date      ? { label: date,      field:null,      value:null       } : null,
  ].filter(Boolean);
  const tagHtml = tagItems.map((t,i) => {
    const isActive = activeTagFilter && activeTagFilter.field === t.field && activeTagFilter.value === t.value;
    const clickAttrs = t.field
      ? `onclick="event.stopPropagation();setTagFilter('${t.field}','${t.value}','${t.label}')" class="card-tag tag-filter${isActive?' tag-active':''}"`
      : `class="card-tag"`;
    return `${i?'<span class="card-sep"> · </span>':''}<span ${clickAttrs}>${esc(t.label)}</span>`;
  }).join('');
  return `<div class="job-card status-${j.status}" onclick="openJobDetail('${j.id}')">
    <div class="card-top">
      <div>
        <div class="card-firma">${esc(j.firma)}</div>
        <div class="card-stelle">${esc(j.stelle)}</div>
      </div>
      <span class="pill pill-${j.status}">${STATUS_LABELS[j.status]||j.status}</span>
    </div>
    <div class="card-bottom">${tagHtml}</div>
  </div>`;
}

// ── INSIGHTS TAB ─────────────────────────────────────────────────────────────
function renderInsights() {
  const el = document.getElementById('insights-content');
  if (!allJobs.length) { el.innerHTML = `<div class="empty"><div class="empty-icon">📊</div><p>No data yet.</p></div>`; return; }

  const c = computeCounts();
  const total = allJobs.length;
  const pct = (n, d) => d ? Math.round(n/d*100) : 0;
  const fmtPct = (n, d) => d ? `${Math.round(n/d*100)}%` : '—';

  // ── Funnel numbers ──────────────────────────────────────────────────────────
  const sent      = allJobs.filter(j => j.verschicktAm).length;
  const interestedCount = allJobs.filter(j => INTERESTED_IDS.has(j.id)).length;
  const interview = allJobs.filter(j => ['interview','espera','zusage'].includes(j.status)).length;
  const offers    = c.zusage;
  const active    = c.bearbeitung + c.interview + c.espera;
  const rejected  = c.absage;

  // ── Conversion: closed = sent + not active/pruefen/bearbeitung ──────────────
  const closed = allJobs.filter(j => ['absage','zusage'].includes(j.status));
  const closedCount = closed.length;
  const convRate = pct(interestedCount, closedCount + interestedCount - c.zusage);

  // ── Monthly volume ──────────────────────────────────────────────────────────
  const byMonth = {};
  allJobs.forEach(j => {
    if (!j.verschicktAm) return;
    const key = j.verschicktAm.slice(0,7);
    byMonth[key] = (byMonth[key]||0) + 1;
  });
  const monthKeys = Object.keys(byMonth).sort().slice(-6);

  // ── Source conversion ───────────────────────────────────────────────────────
  const srcData = {};
  allJobs.forEach(j => {
    const s = j.quelle || 'Unknown';
    if (!srcData[s]) srcData[s] = {n:0, interested:0};
    srcData[s].n++;
    if (INTERESTED_IDS.has(j.id)) srcData[s].interested++;
  });
  const topSrcs = Object.entries(srcData).sort((a,b)=>b[1].n-a[1].n).slice(0,5);
  const maxSrcN = topSrcs[0]?.[1].n || 1;

  // ── Modality conversion (modus) ─────────────────────────────────────────────
  const modiData = {};
  allJobs.forEach(j => {
    const m = j.modus || 'Unknown';
    if (!modiData[m]) modiData[m] = {n:0, interested:0};
    modiData[m].n++;
    if (INTERESTED_IDS.has(j.id)) modiData[m].interested++;
  });
  const topModi = Object.entries(modiData).sort((a,b)=>b[1].n-a[1].n).slice(0,4);

  // ── Language conversion (sprache) ───────────────────────────────────────────
  const langData = {};
  allJobs.forEach(j => {
    const l = j.sprache || 'Unknown';
    if (!langData[l]) langData[l] = {n:0, interested:0};
    langData[l].n++;
    if (INTERESTED_IDS.has(j.id)) langData[l].interested++;
  });
  const topLangs = Object.entries(langData).sort((a,b)=>b[1].n-a[1].n).slice(0,4);

  // ── Role-type conversion (by stelle keyword) ────────────────────────────────
  function classifyRole(stelle) {
    const s = (stelle||'').toLowerCase();
    if (/fleet|fuhrpark|fahrzeug/.test(s)) return 'Fleet / Fuhrpark';
    if (/product|produkt|\bpm\b|product owner/.test(s)) return 'Product / PM';
    if (/sales|account|business develop|vertrieb|bdm/.test(s)) return 'Sales / BD';
    if (/strateg|biz.?ops|business.?ops/.test(s)) return 'Strategy & BizOps';
    if (/operat|ops |betrieb|\bops\b/.test(s)) return 'Ops Manager';
    return 'Other';
  }
  const roleData = {};
  allJobs.forEach(j => {
    const r = classifyRole(j.stelle);
    if (!roleData[r]) roleData[r] = {n:0, interested:0};
    roleData[r].n++;
    if (INTERESTED_IDS.has(j.id)) roleData[r].interested++;
  });
  const topRoles = Object.entries(roleData)
    .filter(([,v]) => v.n >= 3)
    .sort((a,b)=>b[1].interested/b[1].n - a[1].interested/a[1].n);

  // ── Avg days open ───────────────────────────────────────────────────────────
  const openJobs = allJobs.filter(j => j.status === 'verschickt' && j.verschicktAm);
  const today = new Date();
  const avgDays = openJobs.length
    ? Math.round(openJobs.reduce((sum,j)=>sum+(today-new Date(j.verschicktAm))/(1000*86400),0)/openJobs.length)
    : null;
  const thisMonth = todayStr().slice(0,7);
  const thisMonthCount = allJobs.filter(j => (j.verschicktAm||'').startsWith(thisMonth)).length;

  // ── Helper: mini bar ────────────────────────────────────────────────────────
  const bar = (w, color='var(--accent)') =>
    `<div style="flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden">
      <div style="height:100%;width:${Math.max(2,w)}%;background:${color};border-radius:3px;transition:width .3s"></div>
    </div>`;

  document.getElementById('modal-body').innerHTML = `

      <div><div class="detail-label">Location</div><div class="detail-value">${esc(j.ort)}${modus ? ' · '+modus : ''}</div></div>
      <div><div class="detail-label">Language</div><div class="detail-value">${j.sprache==='Deutsch'?'🇩🇪 DE':j.sprache==='Englisch'?'🇬🇧 EN':esc(j.sprache)}</div></div>
      <div><div class="detail-label">Source</div><div class="detail-value">${esc(j.quelle)||'—'}</div></div>
      <div><div class="detail-label">Found</div><div class="detail-value">${j.gefundenAm?formatDate(j.gefundenAm):'—'}</div></div>
    </div>
    <div class="detail-section">
      <div class="detail-label">Status</div>
      <div class="status-options">
        ${Object.entries(STATUS_LABELS).map(([k,v])=>`
          <div class="status-opt${j.status===k?' selected':''}" style="background:${STATUS_COLORS[k].bg};color:${STATUS_COLORS[k].text}"
            onclick="quickStatus('${id}','${k}',this)">${v}</div>
        `).join('')}
      </div>
    </div>
    ${j.notiz?`<div class="detail-section"><div class="detail-label">Notes</div><div class="detail-notiz">${esc(j.notiz)}</div></div>`:''}
    ${j.link?`<div class="detail-section"><a href="${esc(j.link)}" target="_blank" rel="noopener" class="doc-chip">🔗 Job listing</a></div>`:''}
    ${j.unterlagen&&j.unterlagen.length?`<div class="detail-section"><div class="detail-label">Documents</div><div>${j.unterlagen.map(d=>`<a class="doc-chip" href="${esc(d.url)}" target="_blank" rel="noopener">📎 ${esc(d.name)}</a>`).join('')}</div></div>`:''}
    ${j.verschicktAm?`<div style="font-size:.75rem;color:var(--subtle);margin-top:8px">Sent: ${formatDate(j.verschicktAm)}</div>`:''}
  `;
  document.getElementById('modal-footer').innerHTML = `
    <button class="btn btn-ghost btn-sm" onclick="openEditForm('${id}')">✏️ Edit</button>
    <button class="btn btn-danger btn-sm" onclick="confirmDelete('${id}')">Delete</button>
    <button class="btn btn-ghost btn-sm" onclick="closeModal()">Close</button>
  `;
  openModal();
}

async function quickStatus(id, newStatus, el) {
  const j = allJobs.find(x => x.id === id);
  if (!j) return;
  el.closest('.status-options').querySelectorAll('.status-opt').forEach(x => x.classList.remove('selected'));
  el.classList.add('selected');
  j.status = newStatus;
  if (newStatus === 'verschickt' && !j.verschicktAm) j.verschicktAm = todayStr();
  j.updatedAt = nowISO();
  try {
    await sheetsPut(`${SHEET}!A${j._row}:Q${j._row}`, [objToRow(j)]);
    renderAll(); showToast('Status updated');
  } catch(e) { showToast('Error: ' + e.message); }
}

function openEditForm(id) {
  const j = allJobs.find(x => x.id === id);
  if (!j) return;
  document.getElementById('modal-title').textContent = 'Edit';
  document.getElementById('modal-body').innerHTML = jobForm(j);
  document.getElementById('modal-footer').innerHTML = `
    <button class="btn btn-ghost" onclick="openJobDetail('${id}')">Cancel</button>
    <button class="btn btn-primary" onclick="saveEdit('${id}')">Save</button>
  `;
}
async function saveEdit(id) {
  const j = allJobs.find(x => x.id === id);
  if (!j) return;
  readForm(j); j.updatedAt = nowISO();
  try {
    await sheetsPut(`${SHEET}!A${j._row}:Q${j._row}`, [objToRow(j)]);
    renderAll(); closeModal(); showToast('Saved');
  } catch(e) { showToast('Error: ' + e.message); }
}

function openAddModal() {
  document.getElementById('modal-title').textContent = 'Add Job';
  document.getElementById('modal-body').innerHTML = jobForm({status:'pruefen',sprache:'Englisch',modus:'',gefundenAm:todayStr()});
  document.getElementById('modal-footer').innerHTML = `
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveNew()">Add</button>
  `;
  openModal();
}
async function saveNew() {
  const j = {unterlagen:[], createdAt:nowISO(), updatedAt:nowISO()};
  readForm(j);
  if (!j.firma || !j.stelle) { showToast('Company and role are required'); return; }
  j.id = slug(j.firma) + '-' + todayStr().replace(/-/g,'');
  if (allJobs.find(x => x.id === j.id)) j.id += '-' + Math.random().toString(36).slice(2,5);
  if (!j.verschicktAm && j.status === 'verschickt') j.verschicktAm = todayStr();
  try {
    await sheetsAppend(`${SHEET}!A:Q`, [objToRow(j)]);
    await loadJobs(); closeModal(); showToast('Job added');
  } catch(e) { showToast('Error: ' + e.message); }
}
async function confirmDelete(id) {
  if (!confirm('Delete this job?')) return;
  const j = allJobs.find(x => x.id === id);
  if (!j) return;
  try {
    await sheetsClear(`${SHEET}!A${j._row}:Q${j._row}`);
    allJobs = allJobs.filter(x => x.id !== id);
    renderAll(); closeModal(); showToast('Deleted');
  } catch(e) { showToast('Error: ' + e.message); }
}

// ── PDF EXPORT ────────────────────────────────────────────────────────────────
function exportPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ format:'a4', unit:'mm' });
  const KUNDENNR = localStorage.getItem('kundennr') || '—';
  const sent = allJobs.filter(j => j.verschicktAm && j.status !== 'verworfen')
    .sort((a,b) => (b.verschicktAm||'').localeCompare(a.verschicktAm||''));
  doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text('Nachweis der Eigenbemuehungen', 14, 18);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text(`Name: ${OWNER_NAME}`, 14, 27);
  doc.text(`Kundennummer: ${KUNDENNR}`, 14, 33);
  doc.text(`Erstellt: ${new Date().toLocaleDateString('de-DE')}`, 14, 39);
  doc.autoTable({
    startY: 46,
    head: [['Nr.','Datum','Arbeitgeber','Stelle','Ort','Bewerbungsweg','Stand']],
    body: sent.map((j,i) => [
      i+1, j.verschicktAm ? new Date(j.verschicktAm).toLocaleDateString('de-DE') : '',
      j.firma, j.stelle, j.ort, j.weg||j.quelle||'',
      STATUS_LABELS[j.status]||j.status
    ]),
    styles: { fontSize:8, cellPadding:3 },
    headStyles: { fillColor:[13,13,13], textColor:245, fontStyle:'bold' },
    alternateRowStyles: { fillColor:[243,242,237] }
  });
  const month = MONTHS[new Date().getMonth()];
  doc.save(`Bewerbungsnachweis_${OWNER_NAME.replace(/\s/g,'_')}_${month}${new Date().getFullYear()}.pdf`);
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function openModal()  { document.getElementById('job-modal').classList.add('open'); }
function closeModal() { document.getElementById('job-modal').classList.remove('open'); }
document.getElementById('job-modal').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });

// ── TABS ──────────────────────────────────────────────────────────────────────
function switchTab(name, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  (btn || document.getElementById('nav-'+name)).classList.add('active');
  document.getElementById('fab-btn').style.display = (name === 'jobs' || name === 'home') ? 'flex' : 'none';
  if (name === 'jobs') { renderStats(); renderJobs(); }
  if (name === 'home') renderHome();
}

// ── PROFILE SHEET ─────────────────────────────────────────────────────────────
function openProfileSheet() {
  document.getElementById('profile-sheet-bg').classList.add('open');
}
function closeProfileSheet() {
  document.getElementById('profile-sheet-bg').classList.remove('open');
}

// ── UTILS ──────────────────────────────────────────────────────────────────────
function v(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatDate(s) {
  if (!s) return '';
  const [y,m,d] = s.split('-');
  return `${parseInt(d)} ${MONTHS[parseInt(m)-1]} ${y}`;
}
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ── INIT ───────────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  const knEl = document.getElementById('report-kundennr');
  if (knEl) knEl.textContent = localStorage.getItem('kundennr') || '—';
  const waitGIS = setInterval(() => {
    if (window.google && window.google.accounts) {
      clearInterval(waitGIS);
      initGoogleAuth();
    }
  }, 100);
});
</script>
